<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotWise - Service Map</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map-styles.css">
</head>
<body>
    <!-- Header section -->
    <header class="header_section">
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg custom_nav-container">
                <a class="navbar-brand" href="index.html">
                    <span>SpotWise</span>
                </a>
                <div class="user-info">
                    <span id="userName">Loading...</span>
                    <span id="userStatus" class="status-indicator"></span>
                </div>
                <!-- Add Request Button (visible only for seekers) -->
                <button id="createRequestBtn" class="btn btn-primary" onclick="openRequestModal()">
                    Create Request
                </button>
            </nav>
        </div>
    </header>

    <!-- Map section -->
    <div class="map-container">
        <div id="serviceMap" class="service-map"></div>
        
        <!-- Service request panel -->
        <div class="request-panel" id="requestPanel">
            <h3>Active Requests</h3>
            <div class="request-list" id="requestList">
                <!-- Requests will be populated here -->
            </div>
        </div>
    </div>

    <!-- Service Request Modal -->
    <div class="modal fade" id="requestModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Service Request</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="serviceRequestForm">
                        <div class="form-group">
                            <label for="serviceCategory">Service Category</label>
                            <select class="form-control" id="serviceCategory" required>
                                <option value="">Select a service...</option>
                                <option value="plumbing">Plumbing</option>
                                <option value="electrical">Electrical</option>
                                <option value="carpentry">Carpentry</option>
                                <option value="cleaning">Cleaning</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea class="form-control" id="description" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="contactNumber">Contact Number</label>
                            <input type="tel" class="form-control" id="contactNumber" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label for="duration">Request Valid for (minutes)</label>
                            <input type="number" class="form-control" id="duration" min="30" max="180" value="60" required>
                        </div>
                        <div class="form-group">
                            <label for="additionalDetails">Additional Details (Optional)</label>
                            <textarea class="form-control" id="additionalDetails" rows="2"></textarea>
                        </div>
                        <div class="location-preview">
                            <p>Service Location: <span id="selectedLocation">Using current location</span></p>
                            <button type="button" class="btn btn-secondary" onclick="pickLocation()">
                                Pick Location
                            </button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitRequest()">Submit Request</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Location Picker Modal -->
    <div class="modal fade" id="locationPickerModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Pick Service Location</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="locationPickerMap" style="height: 400px;"></div>
                    <div class="location-search-container" style="margin-top: 10px;">
                        <input type="text" id="locationSearchInput" class="form-control" placeholder="Search for a location...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmLocation()">Confirm Location</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh39n5U-4IoWpsVGUHWdqB6puEkhRLdmI&libraries=places"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js"></script>
    <script src="js/location-service.js"></script>
    <script src="js/socket-service.js"></script>
    <script src="js/map-service.js"></script>
    <script src="js/request-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Initialize services
                const mapElement = 'serviceMap';
                if (!document.getElementById(mapElement)) {
                    console.error(`Map element with ID '${mapElement}' not found`);
                    return;
                }
                
                // Initialize the map
                await window.mapService.initMap(mapElement);
                console.log('Map initialized successfully');
                
                // Connect socket service
                if (window.socketService) {
                    window.socketService.connect();
                    console.log('Socket service connected');
                } else {
                    console.error('Socket service not available');
                }
                
                // Load active requests
                await loadActiveRequests();
                
                // Setup event listeners for real-time updates
                setupSocketListeners();
                
                // Update UI based on user role
                updateUIForUserRole();
            } catch (error) {
                console.error('Error initializing service map:', error);
                alert('Failed to initialize the service map. Please try refreshing the page.');
            }
        });

        // Load active service requests
        async function loadActiveRequests() {
            try {
                const response = await fetch('http://localhost:3000/api/requests/active', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const requests = await response.json();
                
                // Display requests in the sidebar
                const requestList = document.getElementById('requestList');
                requestList.innerHTML = '';
                
                if (requests.length === 0) {
                    requestList.innerHTML = '<p class="no-requests">No active requests</p>';
                    return;
                }
                
                requests.forEach(request => {
                    // Add to sidebar
                    addRequestToList(request);
                    
                    // Add marker to map
                    if (request.location && request.location.coordinates) {
                        window.mapService.addRequestMarker(
                            request._id,
                            {
                                lat: request.location.coordinates[1],
                                lng: request.location.coordinates[0]
                            },
                            {
                                service: request.category,
                                status: request.status,
                                description: request.description,
                                canAccept: canUserAcceptRequest(request)
                            }
                        );
                    }
                });
            } catch (error) {
                console.error('Error loading active requests:', error);
                document.getElementById('requestList').innerHTML = 
                    '<p class="error-message">Failed to load requests. Please try again later.</p>';
            }
        }
        
        // Determine if current user can accept a request
        function canUserAcceptRequest(request) {
            const userRole = localStorage.getItem('userRole');
            return userRole === 'provider' && request.status === 'pending';
        }
        
        // Add request to sidebar list
        function addRequestToList(request) {
            const requestList = document.getElementById('requestList');
            const requestElement = document.createElement('div');
            requestElement.id = `request-${request._id}`;
            requestElement.className = `request-item status-${request.status}`;
            requestElement.innerHTML = `
                <div class="request-header">
                    <span class="service-type">${request.category}</span>
                    <span class="status">${request.status}</span>
                </div>
                <div class="request-body">
                    <p>${request.description}</p>
                </div>
                <div class="request-footer">
                    <small>Created: ${new Date(request.createdAt).toLocaleString()}</small>
                </div>
            `;
            
            requestElement.addEventListener('click', () => {
                // Center map on this request
                if (request.location && request.location.coordinates) {
                    window.mapService.map.setCenter({
                        lat: request.location.coordinates[1],
                        lng: request.location.coordinates[0]
                    });
                    window.mapService.map.setZoom(15);
                    
                    // Open the info window for this marker
                    const marker = window.mapService.markers.get(request._id);
                    if (marker) {
                        google.maps.event.trigger(marker, 'click');
                    }
                }
            });
            
            requestList.appendChild(requestElement);
        }
        
        // Setup socket event listeners
        function setupSocketListeners() {
            if (!window.socketService || !window.socketService.socket) {
                console.error('Socket service not initialized');
                return;
            }
            
            // Provider location updates
            window.socketService.socket.on('providerLocationUpdated', (data) => {
                if (!data || !data.providerId || !data.location) {
                    console.error('Invalid provider location data:', data);
                    return;
                }
                
                const location = {
                    lat: data.location.latitude || data.location.lat,
                    lng: data.location.longitude || data.location.lng
                };
                
                window.mapService.updateProviderMarker(
                    data.providerId,
                    location,
                    data.details || { 
                        name: data.providerName || 'Service Provider',
                        service: data.service || 'General Services',
                        rating: data.rating || '4.5'
                    }
                );
            });

            // Request updates
            window.socketService.socket.on('requestUpdated', (data) => {
                if (!data || !data._id) {
                    console.error('Invalid request update data:', data);
                    return;
                }
                
                updateRequestInList(data);
                
                // If the request is completed or cancelled, remove its marker
                if (data.status === 'completed' || data.status === 'cancelled') {
                    window.mapService.removeMarker(data._id);
                }
            });
            
            // New request created
            window.socketService.socket.on('newRequest', (data) => {
                if (!data || !data._id) {
                    console.error('Invalid new request data:', data);
                    return;
                }
                
                // Add to list and map
                addRequestToList(data);
                
                if (data.location && data.location.coordinates) {
                    window.mapService.addRequestMarker(
                        data._id,
                        {
                            lat: data.location.coordinates[1],
                            lng: data.location.coordinates[0]
                        },
                        {
                            service: data.category,
                            status: data.status,
                            description: data.description,
                            canAccept: canUserAcceptRequest(data)
                        }
                    );
                }
                
                // Show notification
                showNotification('New Service Request', `New ${data.category} request has been created.`);
            });
        }
        
        // Update request in the list
        function updateRequestInList(request) {
            const requestElement = document.getElementById(`request-${request._id}`);
            if (requestElement) {
                requestElement.querySelector('.status').textContent = request.status;
                requestElement.className = `request-item status-${request.status}`;
            }
        }
        
        // Update UI based on user role
        function updateUIForUserRole() {
            const userRole = localStorage.getItem('userRole');
            const createRequestBtn = document.getElementById('createRequestBtn');
            
            if (createRequestBtn) {
                createRequestBtn.style.display = userRole === 'seeker' ? 'block' : 'none';
            }
            
            // Update username display
            const userNameElement = document.getElementById('userName');
            if (userNameElement) {
                userNameElement.textContent = localStorage.getItem('userName') || 'User';
            }
            
            // Update status indicator
            const userStatusElement = document.getElementById('userStatus');
            if (userStatusElement && userRole === 'provider') {
                const status = localStorage.getItem('providerStatus') || 'offline';
                userStatusElement.className = `status-indicator status-${status}`;
                userStatusElement.title = `Status: ${status.charAt(0).toUpperCase() + status.slice(1)}`;
            } else if (userStatusElement) {
                userStatusElement.style.display = 'none';
            }
        }
        
        // Show browser notification
        function showNotification(title, message) {
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    new Notification(title, { body: message });
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            new Notification(title, { body: message });
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
